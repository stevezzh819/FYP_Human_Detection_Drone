# UART bridge profile for external ESP32-C3 on the deck expansion connector.
#
# Reserve UART2 for ESP32 human-detection packets.
# CONFIG_ENABLE_CPX is not set
# CONFIG_ENABLE_CPX_ON_UART2 is not set
# CONFIG_DECK_CPX_HOST_ON_UART2 is not set

# Optional: avoid AI deck/CPX auto-initialization paths that also depend on UART2.
# CONFIG_DECK_AI is not set
